ux_css:
    tokens:
        colors:
            white: '#ffffff'
            black: '#000000'
            gray: { 50: '#f9fafb', 100: '#f3f4f6', 300: '#d1d5db', 500: '#6b7280', 700: '#374151', 900: '#111827' }
            blue: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
            red: { 50: '#fef2f2', 500: '#ef4444', 600: '#dc2626' }
            green: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a' }
        spacing:
            0: '0'
            xs: '0.25rem'
            sm: '0.5rem'
            md: '1rem'
            lg: '1.5rem'
            xl: '2rem'
            2xl: '3rem'
        sizes:
            xs: '20rem'
            sm: '24rem'
            md: '28rem'
            lg: '32rem'
            xl: '36rem'
            full: '100%'
            prose: '65ch'
        radii:
            none: '0'
            sm: '0.125rem'
            md: '0.375rem'
            lg: '0.5rem'
            full: '9999px'
        fontSizes:
            xs: '0.75rem'
            sm: '0.875rem'
            md: '1rem'
            lg: '1.125rem'
            xl: '1.25rem'
            2xl: '1.5rem'
        fontWeights:
            normal: '400'
            medium: '500'
            semibold: '600'
            bold: '700'
        lineHeights:
            tight: '1.25'
            normal: '1.5'
            relaxed: '1.75'
        fonts:
            body: ['Inter', 'sans-serif']
            mono: ['JetBrains Mono', 'monospace']
        shadows:
            sm: '0 1px 2px 0 rgb(0 0 0 / 0.05)'
            md: ['0 4px 6px -1px rgb(0 0 0 / 0.1)', '0 2px 4px -2px rgb(0 0 0 / 0.1)']
            lg: ['0 10px 15px -3px rgb(0 0 0 / 0.1)', '0 4px 6px -4px rgb(0 0 0 / 0.1)']
        zIndex:
            dropdown: '1000'
            modal: '1400'
            toast: '1700'
        durations:
            fast: '150ms'
            normal: '250ms'
        easings:
            default: 'cubic-bezier(0.4, 0, 0.2, 1)'

    semantic_tokens:
        colors:
            primary: '{colors.blue.600}'
            danger: '{colors.red.600}'
            success: '{colors.green.600}'
            fg: { base: '{colors.gray.900}', _dark: '{colors.gray.50}' }
            bg: { base: '{colors.white}', _dark: '{colors.gray.900}' }
            muted: { base: '{colors.gray.500}', _dark: '{colors.gray.300}' }
